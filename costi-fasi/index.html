<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Controllo dei costi per fase · MCSec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Nunito+Sans:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root { --bg-deep:#080C10; --bg:#0D1B2A; --panel:#12233C; --panel2:#0F1E33; --border:#23395A; --gold:#C29635; --gold-light:#D4AF37; --text:#FFFFFF; --muted:#B0B8C4;
  --ok:#7FB98A; --ko:#C97B6B; --grey:#6B7686; --input:#1B2E4A; --ered:#8A94A3; --dv-gold:#B08A32; --dv-blue:#5588C0;
  --font:'Nunito Sans','Segoe UI',system-ui,sans-serif; --head:'Manrope','Segoe UI',system-ui,sans-serif; --serif:'Playfair Display',Georgia,serif; }
* { box-sizing:border-box; }
html,body { margin:0; color:var(--text); font-family:var(--font); font-size:13px; line-height:1.45; }
body { padding:0 16px 40px; background: radial-gradient(ellipse at 75% 15%, rgba(37,53,81,0.55) 0%, transparent 55%), linear-gradient(165deg, #0D1B2A 0%, #080C10 90%) fixed; min-height:100vh; }
.wrap { max-width:1280px; margin:0 auto; }
header { display:flex; align-items:flex-end; justify-content:space-between; padding:16px 0 12px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
header .brand { display:flex; gap:14px; align-items:center; }
header img { height:34px; width:auto; }
header .kicker { font-family:var(--head); font-weight:700; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-light); }
header .pillar { font-family:var(--serif); font-style:italic; color:var(--muted); font-size:12px; }
header h1 { font-family:var(--head); font-weight:800; font-size:21px; margin:2px 0 0; line-height:1.2; }
header h1 .gold { color:var(--gold-light); }
.tools { display:flex; gap:6px; flex-wrap:wrap; }
button { font-family:var(--head); font-weight:700; font-size:12px; padding:7px 11px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
button:hover { border-color:var(--gold); }
button.primary { background:var(--gold); color:#0D1B2A; border-color:var(--gold); }
button:disabled { opacity:.4; cursor:default; }
.passi { display:flex; gap:6px; margin:14px 0; flex-wrap:wrap; }
.passi button { flex:1; min-width:180px; text-align:left; padding:10px 12px; }
.passi button.attivo { border-color:var(--gold); background:var(--panel2); box-shadow:0 0 0 1px rgba(194,150,53,.35); }
.passi .n { color:var(--gold-light); margin-right:6px; }
.passi small { display:block; color:var(--muted); font-weight:400; font-family:var(--font); }
.card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin:10px 0; }
h2 { font-family:var(--head); font-weight:800; font-size:16px; margin:4px 0 8px; }
h3 { font-family:var(--head); font-weight:700; font-size:13px; color:var(--gold-light); margin:14px 0 6px; }
.lede { border-left:3px solid var(--gold); padding-left:10px; color:var(--muted); font-size:12.5px; margin:4px 0 10px; }
p.note { color:var(--muted); font-size:12px; margin:4px 0 8px; }
table { border-collapse:collapse; width:100%; font-size:12px; }
th, td { border:1px solid var(--border); padding:4px 6px; text-align:right; white-space:nowrap; }
th { background:var(--panel2); font-family:var(--head); font-weight:700; font-size:11px; color:var(--muted); }
td:first-child, th:first-child { text-align:left; }
.scroll { overflow-x:auto; }
input.cella { width:74px; background:var(--input); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 5px; font:inherit; text-align:right; }
input.cella.ereditato { color:var(--ered); font-style:italic; }
input.cella.scritto { border-color:var(--gold); }
input.cella.errore { border-color:var(--ko); background:rgba(201,123,107,.15); }
input.nome { width:140px; background:var(--input); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 5px; font:inherit; }
.semaforo { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.semaforo.ok { background:var(--ok); } .semaforo.ko { background:var(--ko); } .semaforo.tace { background:var(--grey); }
.ko-box { border-color:var(--ko); }
.msg { padding:8px 10px; border-radius:6px; margin:8px 0; font-size:12px; }
.msg.err { background:rgba(201,123,107,.15); border:1px solid var(--ko); }
.msg.ok { background:rgba(127,185,138,.12); border:1px solid var(--ok); }
.chip { display:inline-block; padding:3px 8px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); font-size:11px; margin:0 4px 6px 0; }
.chip button { padding:0 6px; font-size:10px; margin-left:2px; }
footer { margin-top:30px; padding-top:10px; border-top:1px solid var(--border); color:var(--muted); font-size:11px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
textarea.json { width:100%; height:140px; background:var(--input); color:var(--text); border:1px solid var(--border); border-radius:6px; font:12px/1.4 Consolas,monospace; padding:8px; }
.derivati td:first-child { color:var(--muted); }
@media (max-width:640px) { header h1 { font-size:17px; } input.cella { width:60px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <img src="logo-mcsec-oro.png" alt="MCSec">
    <div>
      <div class="kicker">Performance Intelligence</div>
      <div class="pillar">il controllo di gestione automatizzato, per ogni reparto che conta</div>
      <h1>Controllo dei costi per fase <span class="gold">a costo standard</span></h1>
    </div>
  </div>
  <div class="tools">
    <button id="btnEsempio">Ricarica esempio 10 pezzi</button>
    <button id="btnCopia">Copia JSON</button>
    <button id="btnIncolla">Incolla JSON</button>
    <button id="btnAzzera">Azzera</button>
  </div>
</header>
<div id="avviso"></div>
<nav class="passi">
  <button data-passo="1"><span class="n">01</span>Standard<small>fasi, percorso, parametri per mese</small></button>
  <button data-passo="2"><span class="n">02</span>Consuntivo<small>il reale, mese per mese</small></button>
  <button data-passo="3"><span class="n">03</span>Risultati<small>registro, semilavorati, sintesi, costo prodotto</small></button>
</nav>
<main id="main"></main>
<footer><span>www.mcsec.it &nbsp;|&nbsp; info@mcsec.it &nbsp;|&nbsp; Catania (CT)</span><span>Performance Intelligence · metodologia MCSec · demo con dati di esempio</span></footer>
</div>

<script src="engine.js"></script>
<script src="esempio.js"></script>
<script>
'use strict';
const CHIAVE = 'mcsec.costiFasi.v1';
const VOCI = [['capacita', 'Capacità (pezzi al mese)', 0], ['var', 'Variabile € per pezzo', 2], ['fisso', 'Fisso di fase € al mese', 2], ['scrap', 'Scrap normale %', 1]];
const stato = { scenario: null, risultato: null, passo: 1, meseCorrente: 1, scheda: 'costo', filtri: null };

// ---- formato it-IT
function fmt(x, dec = 2) {
  if (x === null || x === undefined || x === '' || Number.isNaN(Number(x))) return '–';
  return Number(x).toLocaleString('it-IT', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function pct(x) { return x === null || x === undefined ? '–' : fmt(x * 100, 1) + ' %'; }

// ---- stato, salvataggio, import/export
function ricalcola() { stato.risultato = CostiFasi.calcola(stato.scenario); salva(); }
function salva() { try { localStorage.setItem(CHIAVE, JSON.stringify(stato.scenario)); } catch (e) { avviso('Il browser non permette di salvare: alla chiusura si perde tutto (finestra privata?).', 'err'); } }
function carica() {
  try { const t = localStorage.getItem(CHIAVE); if (t) { const r = importaScenario(t, true); if (r.ok) return; } } catch (e) { /* localStorage assente */ }
  stato.scenario = structuredClone(ESEMPIO_10_PEZZI);
}
function importaScenario(testo, silenzioso) {
  let sc;
  try { sc = JSON.parse(testo); } catch (e) { return { ok: false, errore: 'Il testo incollato non è un JSON valido.' }; }
  if (!sc || sc.versione !== 1) return { ok: false, errore: `Versione dello scenario non riconosciuta (${sc && sc.versione}): questa app legge la versione 1.` };
  const err = CostiFasi.validaScenario(sc);
  if (err.length) return { ok: false, errore: 'Scenario incoerente: ' + err.join(' ') };
  stato.scenario = sc; if (!silenzioso) { ricalcola(); render(); }
  return { ok: true };
}
function esportaScenario() { return JSON.stringify(stato.scenario, null, 1); }
function avviso(testo, tipo) { const el = document.getElementById('avviso'); el.innerHTML = testo ? `<div class="msg ${tipo || 'ok'}">${testo}</div>` : ''; }

// ---- helpers DOM
function h(tag, attrs, ...figli) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined) el.setAttribute(k, v); }
  for (const f of figli.flat()) if (f !== null && f !== undefined) el.append(f.nodeType ? f : document.createTextNode(String(f)));
  return el;
}
function cellaInput(valore, opts) {   // opts: {classe, onchange, min, max, intero, regola, placeholder, title}
  const inp = h('input', { class: 'cella ' + (opts.classe || ''), type: 'text', inputmode: 'decimal', value: valore === null || valore === undefined ? '' : String(valore).replace('.', ','), placeholder: opts.placeholder || '', title: opts.title || '' });
  inp.addEventListener('change', () => {
    const t = inp.value.trim().replace(/\./g, '').replace(',', '.');
    if (t === '') { opts.onchange(null); return; }
    const v = Number(t);
    if (Number.isNaN(v) || (opts.min !== undefined && v < opts.min) || (opts.intero && !Number.isInteger(v)) || (opts.max !== undefined && v > opts.max)) { inp.classList.add('errore'); inp.title = opts.regola || 'Valore non ammesso'; return; }
    inp.classList.remove('errore'); opts.onchange(v);
  });
  return inp;
}
function nomeFase(fid) { return (stato.scenario.fasi.find(x => x.id === fid) || {}).nome || fid; }

// ---- Passo 1 · Standard
function renderStandard(el) {
  const sc = stato.scenario, prod = sc.prodotti[0];
  const card = h('div', { class: 'card' }, h('h2', {}, 'Passo 01 · Standard: fasi, percorso e parametri per mese'),
    h('div', { class: 'lede' }, 'Lo standard per pezzo si calcola a capacità piena: variabile + (fisso ÷ OLC). I mesi senza valore ereditano dal mese precedente (celle in corsivo); un valore scritto a mano (bordo oro) vale da quel mese in poi. Svuotare una cella la riporta all\'eredità.'));
  // catalogo fasi
  const cat = h('div', {}, h('h3', {}, 'Catalogo fasi della linea'));
  const tb = h('table', { style: 'width:auto' }, h('thead', {}, h('tr', {}, h('th', {}, 'Id'), h('th', {}, 'Nome'), h('th', {}, 'Nel percorso'), h('th', {}, ''))));
  for (const f of sc.fasi) {
    const inUso = prod.percorso.includes(f.id);
    tb.append(h('tr', {}, h('td', {}, f.id),
      h('td', {}, h('input', { class: 'nome', value: f.nome, onchange: e => { f.nome = e.target.value; ricalcola(); render(); } })),
      h('td', { style: 'text-align:center' }, h('input', { type: 'checkbox', ...(inUso ? { checked: '' } : {}), onchange: e => { if (e.target.checked) prod.percorso.push(f.id); else prod.percorso = prod.percorso.filter(x => x !== f.id); ricalcola(); render(); } })),
      h('td', {}, h('button', { disabled: inUso ? '' : null, title: inUso ? 'Togli prima la fase dal percorso' : 'Elimina dal catalogo', onclick: () => { sc.fasi = sc.fasi.filter(x => x.id !== f.id); delete sc.parametri[f.id]; ricalcola(); render(); } }, '✕'))));
  }
  cat.append(tb, h('button', { style: 'margin-top:6px', onclick: () => { let k = sc.fasi.length + 1; while (sc.fasi.some(x => x.id === 'F' + k)) k++; const id = 'F' + k; sc.fasi.push({ id, nome: 'Fase ' + k }); sc.parametri[id] = { capacita: {}, var: {}, fisso: {}, scrap: {} }; render(); } }, '+ Aggiungi fase'));
  // percorso
  const per = h('div', {}, h('h3', {}, `Percorso di ${prod.nome}`), h('p', { class: 'note' }, 'Ordine in cui il pezzo attraversa le fasi. Frecce per riordinare; la spunta nel catalogo aggiunge o toglie una fase.'));
  prod.percorso.forEach((fid, i) => {
    per.append(h('span', { class: 'chip' }, `${String(i + 1).padStart(2, '0')} › ${nomeFase(fid)} `,
      h('button', { disabled: i === 0 ? '' : null, onclick: () => { [prod.percorso[i - 1], prod.percorso[i]] = [prod.percorso[i], prod.percorso[i - 1]]; ricalcola(); render(); } }, '◀'),
      h('button', { disabled: i === prod.percorso.length - 1 ? '' : null, onclick: () => { [prod.percorso[i + 1], prod.percorso[i]] = [prod.percorso[i], prod.percorso[i + 1]]; ricalcola(); render(); } }, '▶')));
  });
  card.append(cat, per);
  // griglie parametri
  const mesi = sc.mesi || 12;
  for (const [voce, titolo] of VOCI) {
    const g = h('div', { class: 'scroll' }, h('h3', {}, titolo));
    const t = h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Fase'), ...Array.from({ length: mesi }, (_, m) => h('th', {}, 'M' + (m + 1))))));
    for (const fid of prod.percorso) {
      const p = sc.parametri[fid] = sc.parametri[fid] || { capacita: {}, var: {}, fisso: {}, scrap: {} };
      const tr = h('tr', {}, h('td', {}, nomeFase(fid)));
      for (let m = 1; m <= mesi; m++) {
        const scritto = p[voce][String(m)] !== undefined && p[voce][String(m)] !== null && p[voce][String(m)] !== '';
        const v = CostiFasi.eredita(p[voce], m);
        const mostra = v === null ? null : (voce === 'scrap' ? v * 100 : v);
        tr.append(h('td', {}, cellaInput(mostra === null ? null : Number(mostra.toFixed(4)), { classe: scritto ? 'scritto' : 'ereditato', min: 0, max: voce === 'scrap' ? 99 : undefined,
          regola: voce === 'scrap' ? 'tra 0 e 99' : 'numero ≥ 0', placeholder: m === 1 ? 'obbl.' : '',
          onchange: x => { if (x === null) delete p[voce][String(m)]; else p[voce][String(m)] = voce === 'scrap' ? x / 100 : x; ricalcola(); render(); } })));
      }
      t.append(tr);
    }
    g.append(t); card.append(g);
  }
  // derivati per mese
  const r = stato.risultato;
  if (r && !r.errori.length) {
    const d = h('div', { class: 'scroll' }, h('h3', {}, 'Derivati per mese: OLC, standard per pezzo, cumulato, totale prodotto'));
    const t = h('table', { class: 'derivati' }, h('thead', {}, h('tr', {}, h('th', {}, 'Voce'), ...r.parametri.map(p => h('th', {}, 'M' + p.mese)))));
    t.append(h('tr', {}, h('td', {}, 'OLC (posti in linea)'), ...r.parametri.map(p => h('td', {}, fmt(p.OLC, 0)))));
    for (const f of r.fasi) t.append(h('tr', {}, h('td', {}, `Standard ${f.nome} €/pz`), ...r.parametri.map(p => h('td', {}, fmt(p.fasi[f.id].E)))));
    for (const f of r.fasi) t.append(h('tr', {}, h('td', {}, `Cumulato ${f.nome} €/pz`), ...r.parametri.map(p => h('td', {}, fmt(p.fasi[f.id].Fcum)))));
    t.append(h('tr', {}, h('td', {}, 'Totale prodotto €/pz'), ...r.parametri.map(p => h('td', {}, fmt(p.E7)))));
    t.append(h('tr', {}, h('td', {}, 'Fissi di linea € al mese'), ...r.parametri.map(p => h('td', {}, fmt(p.fissiTot)))));
    d.append(t); card.append(d);
  }
  el.append(card);
}

function renderConsuntivo(el) { el.append(h('div', { class: 'card' }, 'Passo 02 in arrivo.')); }
function renderRisultati(el) { el.append(h('div', { class: 'card' }, 'Passo 03 in arrivo.')); }

// ---- render generale
function render() {
  document.querySelectorAll('.passi button').forEach(b => b.classList.toggle('attivo', Number(b.dataset.passo) === stato.passo));
  const main = document.getElementById('main'); main.innerHTML = '';
  const r = stato.risultato;
  if (r && r.errori.length) main.append(h('div', { class: 'msg err' }, 'Il motore non parte: ', h('ul', {}, ...r.errori.map(e => h('li', {}, e)))));
  if (stato.passo === 1) renderStandard(main); else if (stato.passo === 2) renderConsuntivo(main); else renderRisultati(main);
}
document.querySelectorAll('.passi button').forEach(b => b.addEventListener('click', () => { stato.passo = Number(b.dataset.passo); render(); }));
document.getElementById('btnEsempio').addEventListener('click', () => { stato.scenario = structuredClone(ESEMPIO_10_PEZZI); stato.filtri = null; ricalcola(); avviso('Esempio dei 10 pezzi ricaricato.'); render(); });
document.getElementById('btnAzzera').addEventListener('click', () => { if (!confirm('Azzero tutto lo scenario? Fasi, parametri e consuntivo.')) return;
  stato.scenario = { versione: 1, nome: 'Nuovo scenario', mesi: 12, fasi: [{ id: 'F1', nome: 'Fase 1' }], parametri: { F1: { capacita: {}, var: {}, fisso: {}, scrap: {} } }, prodotti: [{ id: 'P1', nome: 'Prodotto 1', percorso: ['F1'] }], registro: { P1: {} }, filtri: { daMese: 1, aMese: 12, fase: 'tutte' } };
  stato.passo = 1; stato.filtri = null; ricalcola(); avviso(''); render(); });
document.getElementById('btnCopia').addEventListener('click', async () => { const t = esportaScenario(); try { await navigator.clipboard.writeText(t); avviso('Scenario copiato negli appunti.'); } catch (e) { mostraJson(t); } });
document.getElementById('btnIncolla').addEventListener('click', () => mostraJson(''));
function mostraJson(testo) {
  avviso('');
  const ta = h('textarea', { class: 'json', placeholder: 'Incolla qui lo scenario JSON' }); ta.value = testo;
  const box = h('div', { class: 'card' }, h('h3', {}, 'Scenario in testo (JSON)'), ta,
    h('div', { style: 'margin-top:6px;display:flex;gap:6px' }, h('button', { class: 'primary', onclick: () => { const r = importaScenario(ta.value); if (!r.ok) avviso(r.errore, 'err'); else { avviso('Scenario importato.'); box.remove(); } } }, 'Importa'), h('button', { onclick: () => box.remove() }, 'Chiudi')));
  document.getElementById('main').prepend(box);
}
carica(); ricalcola(); render();
</script>
</body>
</html>
