<style>
:root{color-scheme:dark; --bg-deep:#080C10; --bg-navy:#0D1B2A; --card:#12233C; --line:#23395A; --gold:#C29635; --gold-light:#D4AF37; --ink:#F2F5F9; --ink-2:#B0B8C4; --ink-3:#8492A6; --bad:#C97B6B}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; display:flex; align-items:center; justify-content:center; padding:24px 20px; color:var(--ink);
  font-family:'Nunito Sans','Segoe UI',system-ui,sans-serif; font-size:16px; line-height:1.45;
  background:radial-gradient(ellipse at 75% 15%, rgba(37,53,81,.55) 0%, transparent 55%), linear-gradient(165deg, var(--bg-navy) 0%, var(--bg-deep) 90%) var(--bg-deep)}
main{width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:30px 28px 26px; display:flex; flex-direction:column; gap:16px}
img{height:46px; width:auto; align-self:flex-start}
.kicker{font-family:'Manrope','Segoe UI',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold)}
h1{font-family:'Manrope','Segoe UI',sans-serif; font-weight:800; font-size:22px; margin:2px 0 0}
p{margin:0; color:var(--ink-2)}
form{display:flex; flex-direction:column; gap:10px}
label{font-size:13px; color:var(--ink-3)}
input{font:inherit; color:var(--ink); background:var(--bg-navy); border:1px solid var(--line); border-radius:8px; padding:12px 13px; width:100%}
button{font-family:'Manrope','Segoe UI',sans-serif; font-weight:800; font-size:15px; border:0; border-radius:8px; padding:13px 18px; cursor:pointer; background:var(--gold); color:#0B1420}
button:hover{background:var(--gold-light)} button[disabled]{opacity:.6; cursor:progress}
:focus-visible{outline:2px solid var(--gold-light); outline-offset:2px}
#err{color:var(--bad); font-size:14px; min-height:20px}
footer{font-size:12.5px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:12px; letter-spacing:.03em}
</style>
</head>

async function decifra(pw) {
  const b = Uint8Array.from(atob(P), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b.slice(0, 16), iterations: IT, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(16, 28)}, key, b.slice(28)));
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  err.textContent = '';
  if (!window.crypto || !crypto.subtle) { err.textContent = 'Questo browser non può aprire la pagina. Usa una versione recente di Chrome, Edge, Safari o Firefox.'; return; }
  b.disabled = true; b.textContent = 'Apro…';
  try {
    const html = await decifra(document.getElementById('pw').value);
    document.open(); document.write(html); document.close();
  } catch (x) {
    err.textContent = 'Password non corretta. Controlla maiuscole e spazi e riprova.';
    b.disabled = false; b.textContent = 'Apri la demo';
  }
});
