<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Controllo dei costi per fase · multiprodotto · MCSec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Nunito+Sans:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root { --bg-deep:#080C10; --bg:#0D1B2A; --panel:#12233C; --panel2:#0F1E33; --border:#23395A; --gold:#C29635; --gold-light:#D4AF37; --text:#FFFFFF; --muted:#B0B8C4;
  --ok:#7FB98A; --ko:#C97B6B; --grey:#6B7686; --input:#1B2E4A; --ered:#8A94A3; --dv-gold:#B08A32; --dv-blue:#5588C0;
  --font:'Nunito Sans','Segoe UI',system-ui,sans-serif; --head:'Manrope','Segoe UI',system-ui,sans-serif; --serif:'Playfair Display',Georgia,serif; }
* { box-sizing:border-box; }
html,body { margin:0; color:var(--text); font-family:var(--font); font-size:13px; line-height:1.45; }
body { padding:0 16px 40px; background: radial-gradient(ellipse at 75% 15%, rgba(37,53,81,0.55) 0%, transparent 55%), linear-gradient(165deg, #0D1B2A 0%, #080C10 90%) fixed; min-height:100vh; }
.wrap { max-width:1280px; margin:0 auto; }
header { display:flex; align-items:flex-end; justify-content:space-between; padding:16px 0 12px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
header .brand { display:flex; gap:14px; align-items:center; }
header img { height:34px; width:auto; }
header .kicker { font-family:var(--head); font-weight:700; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-light); }
header .pillar { font-family:var(--serif); font-style:italic; color:var(--muted); font-size:12px; }
header h1 { font-family:var(--head); font-weight:800; font-size:21px; margin:2px 0 0; line-height:1.2; }
header h1 .gold { color:var(--gold-light); }
.tools { display:flex; gap:6px; flex-wrap:wrap; }
button { font-family:var(--head); font-weight:700; font-size:12px; padding:7px 11px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
button:hover { border-color:var(--gold); }
button.primary { background:var(--gold); color:#0D1B2A; border-color:var(--gold); }
button:disabled { opacity:.4; cursor:default; }
.passi { display:flex; gap:6px; margin:14px 0; flex-wrap:wrap; }
.passi button { flex:1; min-width:180px; text-align:left; padding:10px 12px; }
.passi button.attivo { border-color:var(--gold); background:var(--panel2); box-shadow:0 0 0 1px rgba(194,150,53,.35); }
.passi .n { color:var(--gold-light); margin-right:6px; }
.passi small { display:block; color:var(--muted); font-weight:400; font-family:var(--font); }
.card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin:10px 0; }
h2 { font-family:var(--head); font-weight:800; font-size:16px; margin:4px 0 8px; }
h3 { font-family:var(--head); font-weight:700; font-size:13px; color:var(--gold-light); margin:14px 0 6px; }
.lede { border-left:3px solid var(--gold); padding-left:10px; color:var(--muted); font-size:12.5px; margin:4px 0 10px; }
p.note { color:var(--muted); font-size:12px; margin:4px 0 8px; }
table { border-collapse:collapse; width:100%; font-size:12px; }
th, td { border:1px solid var(--border); padding:4px 6px; text-align:right; white-space:nowrap; }
th { background:var(--panel2); font-family:var(--head); font-weight:700; font-size:11px; color:var(--muted); }
td:first-child, th:first-child { text-align:left; }
.scroll { overflow-x:auto; }
input.cella { width:74px; background:var(--input); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 5px; font:inherit; text-align:right; }
input.cella.ereditato { color:var(--ered); font-style:italic; }
input.cella.scritto { border-color:var(--gold); }
.evidenza { border:1px solid var(--gold); border-radius:6px; padding:8px 12px 10px; margin:10px 0; background:var(--panel2); }  /* prodotto finito: il numero in evidenza nei Risultati */
.evidenza h3 { margin:2px 0 8px; }
.evidenza td.big { font-size:16px; font-weight:700; }
.scheda { border:1px solid var(--border); border-radius:6px; padding:8px 12px 10px; margin:8px 0; background:var(--panel2); }  /* scheda del prodotto corrente */
table.consuntivo td { height:52px; position:relative; padding:4px 4px; }
table.consuntivo th { padding:4px 4px; }
table.griglia th, table.griglia td { padding:3px 4px; }   /* griglie fasi × 12 mesi: devono stare nella pagina */
table.griglia input.cella { width:58px; }
table.griglia td:first-child { font-size:11px; }
table.griglia tr.derivati td { font-size:10px; }
table.consuntivo input.cella { width:58px; }   /* più stretta: la tabella per prodotto deve stare nella pagina */  /* righe di uguale altezza, spazio per il suggerimento sotto «entrati» */
.hint { position:absolute; left:6px; right:6px; bottom:1px; color:var(--muted); font-size:10px; line-height:11px; white-space:nowrap; text-align:right; }  /* in sovrapposizione: l'input resta centrato come le altre celle */
input.cella.errore { border-color:var(--ko); background:rgba(201,123,107,.15); }
input.nome { width:140px; background:var(--input); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 5px; font:inherit; }
.semaforo { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.semaforo.ok { background:var(--ok); } .semaforo.ko { background:var(--ko); } .semaforo.tace { background:var(--grey); }
.ko-box { border-color:var(--ko); }
.msg { padding:8px 10px; border-radius:6px; margin:8px 0; font-size:12px; }
.msg.err { background:rgba(201,123,107,.15); border:1px solid var(--ko); }
.msg.ok { background:rgba(127,185,138,.12); border:1px solid var(--ok); }
.chip { display:inline-block; padding:3px 8px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); font-size:11px; margin:0 4px 6px 0; }
.chip button { padding:0 6px; font-size:10px; margin-left:2px; }
footer { margin-top:30px; padding-top:10px; border-top:1px solid var(--border); color:var(--muted); font-size:11px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
textarea.json { width:100%; height:140px; background:var(--input); color:var(--text); border:1px solid var(--border); border-radius:6px; font:12px/1.4 Consolas,monospace; padding:8px; }
.derivati td:first-child { color:var(--muted); }
@media (max-width:640px) { header h1 { font-size:17px; } input.cella { width:60px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <img src="logo-mcsec-oro.png" alt="MCSec">
    <div>
      <div class="kicker">Performance Intelligence</div>
      <div class="pillar">il controllo di gestione automatizzato, per ogni reparto che conta</div>
      <h1>Controllo dei costi per fase <span class="gold">a costo standard · più prodotti</span></h1>
    </div>
  </div>
  <div class="tools">
    <button id="btnEsempio">Ricarica esempio 2 prodotti</button>
    <button id="btnCopia">Copia JSON</button>
    <button id="btnIncolla">Incolla JSON</button>
    <button id="btnAzzera">Azzera</button>
  </div>
</header>
<div id="avviso"></div>
<nav class="passi">
  <button data-passo="1"><span class="n">01</span>Standard<small>linea, prodotti, quote e parametri per mese</small></button>
  <button data-passo="2"><span class="n">02</span>Consuntivo<small>fisso di fase e pezzi per prodotto, mese per mese</small></button>
  <button data-passo="3"><span class="n">03</span>Risultati<small>totale linea e ogni prodotto: quadratura, costo prodotto, schede</small></button>
</nav>
<main id="main"></main>
<footer><span>www.mcsec.it &nbsp;|&nbsp; info@mcsec.it &nbsp;|&nbsp; Catania (CT)</span><span>Performance Intelligence · metodologia MCSec · demo con dati di esempio</span></footer>
</div>

<script src="../costi-fasi/engine.js"></script>
<script src="../costi-fasi/ui.js"></script>
<script src="../costi-fasi/lettura.js"></script>
<script src="linea.js"></script>
<script src="esempio-linea.js"></script>
<script>
'use strict';
const CHIAVE = 'mcsec.costiFasi.v2';
// griglie per prodotto: capacità piena e quota (pezzi), variabile (€/pz), scrap (%)
const VOCI_PRODOTTO = [['capacita', 'Capacità piena della fase per questo prodotto (pezzi al mese)', 0], ['quota', 'Quota riservata (pezzi al mese) · vuota = tutta la capacità piena', 0], ['var', 'Variabile standard € per pezzo', 2], ['scrap', 'Scrap normale %', 1]];
const stato = { scenario: null, risultato: null, passo: 1, meseCorrente: 1, scheda: 'costo', prodottoCorrente: null, vista3: 'linea', filtri: null };   // vista3: 'linea' o id prodotto nel Passo 03

// ---- formato it-IT (funzioni pure in ../costi-fasi/ui.js) e motore di linea (linea.js)
const { fmt, leggiNumero } = CostiFasiUI;
const Linea = CostiFasiLinea;
function pct(x) { return x === null || x === undefined ? '–' : fmt(x * 100, 1) + ' %'; }

// ---- stato, salvataggio, import/export
function ricalcola() { stato.risultato = Linea.calcolaLinea(stato.scenario); salva(); }
function salva() {
  if (stato.nonSalvare) return;   // modalità esempio da URL: non sovrascrive il lavoro salvato
  try { localStorage.setItem(CHIAVE, JSON.stringify(stato.scenario)); } catch (e) { avviso('Il browser non permette di salvare: alla chiusura si perde tutto (finestra privata?).', 'err'); }
}
function carica() {
  let t = null;
  try { t = localStorage.getItem(CHIAVE); } catch (e) { /* localStorage assente */ }
  if (t) {
    const r = Linea.analizzaScenarioV2(t);
    if (r.ok) { stato.scenario = r.scenario; return; }
    try { localStorage.setItem(CHIAVE + '.backup', t); } catch (e) { /* niente */ }
    avviso('Lo scenario salvato nel browser non è leggibile (' + r.errore + ') ed è stato messo da parte. Caricato l\'esempio.', 'err');
  }
  stato.scenario = structuredClone(ESEMPIO_LINEA);
}
function importaScenario(testo) {
  const r = Linea.analizzaScenarioV2(testo);
  if (!r.ok) return r;
  stato.scenario = r.scenario; stato.filtri = null; stato.prodottoCorrente = null; stato.nonSalvare = false; ricalcola(); render();
  return { ok: true, convertito: r.convertito === true };
}
function esportaScenario() { return JSON.stringify(stato.scenario, null, 1); }
function avviso(testo, tipo) { const el = document.getElementById('avviso'); el.replaceChildren(); if (testo) el.append(h('div', { class: 'msg ' + (tipo || 'ok') }, testo)); }
// il prodotto selezionato nei passi 1 e 2 (se non esiste più, il primo)
function prodottoCorrente() { const sc = stato.scenario; if (!sc.prodotti.some(p => p.id === stato.prodottoCorrente)) stato.prodottoCorrente = sc.prodotti[0].id; return sc.prodotti.find(p => p.id === stato.prodottoCorrente); }
function nomeProdotto(pid) { return (stato.scenario.prodotti.find(p => p.id === pid) || {}).nome || pid; }
// pesi e ripartizione del mese m (null se il motore non parte)
function pesiMese(m) { const r = stato.risultato; return r && r.pesi && r.pesi.length ? r.pesi[m - 1] : null; }   // anche con il solo errore Σ pesi: la pagina mostra il rosso
function ripartizioneMese(m) { const r = stato.risultato; return r && !r.errori.length ? r.ripartizione[m - 1] : null; }
// ---- helpers DOM
function h(tag, attrs, ...figli) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined) el.setAttribute(k, v); }
  for (const f of figli.flat()) if (f !== null && f !== undefined) el.append(f.nodeType ? f : document.createTextNode(String(f)));
  return el;
}
function cellaInput(valore, opts) {   // opts: {classe, onchange, min, max, intero, regola, placeholder, title}
  const inp = h('input', { class: 'cella ' + (opts.classe || ''), type: 'text', inputmode: 'decimal', value: valore === null || valore === undefined ? '' : String(valore).replace('.', ','), placeholder: opts.placeholder || '', title: opts.title || '' });
  inp.addEventListener('change', () => {
    const v = leggiNumero(inp.value);
    if (v === null) { opts.onchange(null); return; }
    if (Number.isNaN(v) || (opts.min !== undefined && v < opts.min) || (opts.intero && !Number.isInteger(v)) || (opts.max !== undefined && v > opts.max)) { inp.classList.add('errore'); inp.title = opts.regola || 'Valore non ammesso'; return; }
    inp.classList.remove('errore'); opts.onchange(v);
  });
  return inp;
}
function nomeFase(fid) { return (stato.scenario.fasi.find(x => x.id === fid) || {}).nome || fid; }

// ---- griglia fasi × mesi con eredità dal mese prima (celle in corsivo), valore scritto a mano (bordo oro), placeholder «obbl.» sul mese 1.
// righe: [{ nome, mappa, max?(m) }]; opts: { scala (100 per lo scrap), max, regola, sotto?(riga) → [[etichetta, [[testo, stile], …]], …] }
function grigliaMesi(titolo, righe, opts) {
  const sc = stato.scenario, mesi = sc.mesi || 12, scala = opts.scala || 1;
  const g = h('div', { class: 'scroll' }, h('h3', {}, titolo));
  const t = h('table', { class: 'griglia' }, h('thead', {}, h('tr', {}, h('th', {}, 'Fase'), ...Array.from({ length: mesi }, (_, m) => h('th', {}, 'M' + (m + 1))))));
  for (const r of righe) {
    const tr = h('tr', {}, h('td', {}, r.nome));
    for (let m = 1; m <= mesi; m++) {
      const scritto = r.mappa[String(m)] !== undefined && r.mappa[String(m)] !== null && r.mappa[String(m)] !== '';
      let v = CostiFasi.eredita(r.mappa, m);
      if (v === null && r.fallback) v = r.fallback(m);   // es. quota vuota = capacità piena (mostrata in corsivo, modificabile)
      tr.append(h('td', {}, cellaInput(v === null ? null : Number((v * scala).toFixed(4)), { classe: scritto ? 'scritto' : 'ereditato', min: 0, max: r.max ? r.max(m) : opts.max,
        regola: opts.regola || 'numero ≥ 0', placeholder: m === 1 && !r.fallback ? 'obbl.' : '',
        onchange: x => { if (x === null) delete r.mappa[String(m)]; else r.mappa[String(m)] = x / scala; ricalcola(); render(); } })));
    }
    t.append(tr);
    if (opts.sotto) for (const [etich, valori] of opts.sotto(r)) t.append(h('tr', { class: 'derivati' }, h('td', {}, etich), ...valori.map(([txt, stile]) => h('td', { style: stile || '' }, txt))));
  }
  g.append(t); return g;
}

// ---- Passo 1 · Standard: linea (catalogo fasi, fisso di fase) + schede prodotto
function renderStandard(el) {
  const sc = stato.scenario, mesi = sc.mesi || 12;
  const card = h('div', { class: 'card' }, h('h2', {}, 'Passo 01 · Standard: linea e prodotti'),
    h('div', { class: 'lede' }, 'Lo standard per pezzo di ogni prodotto si calcola a capacità piena: variabile + (fisso del prodotto ÷ OLC del prodotto). Il fisso di fase è uno solo e si divide tra i prodotti in proporzione ai pesi (quota ÷ capacità piena); la parte non riservata a nessun prodotto è dello strato «Linea». I mesi senza valore ereditano dal mese precedente (celle in corsivo); un valore scritto a mano (bordo oro) vale da quel mese in poi. Svuotare una cella la riporta all\'eredità.'));
  // ---- Linea: catalogo fasi
  const usataDa = fid => sc.prodotti.filter(p => p.percorso.includes(fid)).map(p => p.nome);
  const cat = h('div', {}, h('h3', {}, 'Linea · catalogo fasi'));
  const tb = h('table', { style: 'width:auto' }, h('thead', {}, h('tr', {}, h('th', {}, 'Id'), h('th', {}, 'Nome'), h('th', { style: 'text-align:left' }, 'Usata da'), h('th', {}, ''))));
  for (const f of sc.fasi) {
    const usi = usataDa(f.id);
    tb.append(h('tr', {}, h('td', {}, f.id),
      h('td', {}, h('input', { class: 'nome', value: f.nome, onchange: e => { f.nome = e.target.value; ricalcola(); render(); } })),
      h('td', { style: 'text-align:left;color:var(--muted)' }, usi.length ? usi.join(', ') : 'nessun prodotto'),
      h('td', {}, h('button', { disabled: usi.length ? '' : null, title: usi.length ? 'Togli prima la fase dai percorsi dei prodotti' : 'Elimina dal catalogo', onclick: () => {
        sc.fasi = sc.fasi.filter(x => x.id !== f.id); delete sc.linea[f.id];
        for (const m of Object.keys(sc.consuntivo.linea)) { delete sc.consuntivo.linea[m][f.id]; if (!Object.keys(sc.consuntivo.linea[m]).length) delete sc.consuntivo.linea[m]; }
        ricalcola(); render(); } }, '✕'))));
  }
  cat.append(tb, h('button', { style: 'margin-top:6px', onclick: () => { let k = sc.fasi.length + 1; while (sc.fasi.some(x => x.id === 'F' + k)) k++; const id = 'F' + k; sc.fasi.push({ id, nome: 'Fase ' + k }); sc.linea[id] = { fisso: {} }; ricalcola(); render(); } }, '+ Aggiungi fase'));
  // mappa fasi × prodotti a fianco del catalogo: una colonna per prodotto, una riga per fase del catalogo, riquadro nel colore del prodotto se la fase è nel percorso
  const COLP = ['#3987e5', '#199e70', '#c98500', '#d55181'];
  // righe della mappa alte come quelle del catalogo (intestazione 27px, fasi 45px) così le fasi sono sulla stessa riga della tabella
  const mappa = h('div', {}, h('h3', { title: 'Ogni colonna è un prodotto: le fasi che attraversa, nell’ordine del catalogo; il numero è la posizione nel suo percorso.' }, 'Mappa fasi × prodotti'));
  const griglia = h('div', { style: `display:grid;grid-template-columns:repeat(${sc.prodotti.length}, minmax(120px, 160px));grid-template-rows:27px repeat(${sc.fasi.length}, 45px);column-gap:14px;align-items:center` });
  for (const q of sc.prodotti) griglia.append(h('div', { style: 'font-family:var(--head);font-weight:700;font-size:11px;color:var(--muted);text-align:center;align-self:center' }, q.nome));
  for (const f of sc.fasi) for (const [k, q] of sc.prodotti.entries()) {
    const pos = q.percorso.indexOf(f.id);
    griglia.append(pos >= 0
      ? h('div', { title: `${q.nome} · passo ${pos + 1}: ${f.nome}`, style: `border:1px solid ${COLP[k % COLP.length]};border-left:4px solid ${COLP[k % COLP.length]};border-radius:4px;padding:4px 8px;font-size:11px;background:var(--panel2)` }, h('span', { style: 'color:var(--muted);margin-right:6px' }, String(pos + 1).padStart(2, '0')), f.nome)
      : h('div', { style: 'border:1px dashed var(--border);border-radius:4px;height:28px;opacity:.5' }));
  }
  mappa.append(griglia);
  card.append(h('div', { style: 'display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap' }, cat, mappa));
  // ---- Linea: fisso standard di fase, con sotto i pesi di tutti i prodotti e i pezzi equivalenti
  const sottoPesi = riga => {
    const out = [];
    const pesi = Array.from({ length: mesi }, (_, i) => pesiMese(i + 1));
    if (!pesi[0]) return out;
    out.push(['Σ pesi dei prodotti', pesi.map(w => { const x = w.fasi[riga.id]; const st = x.somma > 1 + 1e-9 ? 'color:var(--ko)' : (x.somma === 0 ? 'color:var(--grey)' : ''); return [pct(x.somma), st]; })]);
    const rif = pesi[0].fasi[riga.id].equivalenti;   // il prodotto di riferimento va nell'etichetta, non in ogni cella
    out.push([rif ? `pezzi eq. in ${nomeProdotto(rif.riferimento)}` : 'pezzi equivalenti', pesi.map(w => { const e = w.fasi[riga.id].equivalenti; return [e ? `${fmt(e.usati, Number.isInteger(e.usati) ? 0 : 1)} su ${fmt(e.capacita, 0)}` : '–', 'color:var(--muted)']; })]);
    return out;
  };
  card.append(grigliaMesi('Linea · fisso standard di fase € al mese', sc.fasi.map(f => ({ id: f.id, nome: f.nome, mappa: (sc.linea[f.id] = sc.linea[f.id] || { fisso: {} }).fisso })), { sotto: sottoPesi }));
  renderProdotti(card);
  el.append(card);
}
// ---- schede prodotto: barra dei prodotti, poi la scheda del prodotto corrente (nome, percorso, capacità piena, quota, variabile, scrap, standard risolti)
function renderProdotti(card) {
  const sc = stato.scenario, mesi = sc.mesi || 12, p = prodottoCorrente();
  const bar = h('div', { class: 'passi', style: 'margin:6px 0' });
  for (const q of sc.prodotti) bar.append(h('button', { class: q.id === p.id ? 'attivo' : '', style: 'min-width:0;flex:0 0 auto;padding:7px 12px', onclick: () => { stato.prodottoCorrente = q.id; render(); } }, q.nome));
  bar.append(h('button', { style: 'min-width:0;flex:0 0 auto;padding:7px 12px', onclick: () => { let k = sc.prodotti.length + 1; while (sc.prodotti.some(x => x.id === 'P' + k)) k++; const id = 'P' + k;
    sc.prodotti.push({ id, nome: 'Prodotto ' + k, percorso: [], parametri: {} }); sc.consuntivo[id] = {}; stato.prodottoCorrente = id; ricalcola(); render(); } }, '+ Aggiungi prodotto'));
  card.append(h('h3', {}, 'Prodotti'), h('p', { class: 'note' }, 'Ogni prodotto è uno strato: percorso, quote di capacità, variabile e scrap suoi; il fisso di fase gli arriva in proporzione al peso.'), bar);
  const sez = h('div', { class: 'scheda' });
  sez.append(h('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' }, 'Nome prodotto ',
    h('input', { class: 'nome', style: 'width:260px', value: p.nome, onchange: e => { p.nome = e.target.value.trim() || p.id; ricalcola(); render(); } }),

function renderGrafico3Linea(lpm) {   // per mese una barra per prodotto (colore del prodotto = buoni, scrap in arancio sopra), totale sopra la barra, dettaglio sotto il mese
  const W = 760, H = 270, m = { l: 50, r: 16, t: 26, b: 46 };
